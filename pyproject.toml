[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adsnet"
version = "0.1.0"
description = "Adsorption Network: PaiNN-based GNN for adsorption energy prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "torch>=1.12",
    "numpy>=1.21",
    "ase>=3.22",
    "asap3",
    "scipy>=1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pandas",
    "matplotlib",
    "scikit-learn",
]

[tool.setuptools.packages.find]
include = ["adsnet*"]

[tool.pytest.ini_options]
testpaths = ["test"]
